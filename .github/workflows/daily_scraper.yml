name: Daily OJAS Job Scraper

on:
  schedule:
    # Runs every day at 02:30 UTC = 8:00 AM Indian Standard Time (IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Browsers & Dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 🚀 Run OJAS Scraper
        run: |
          python scrape_ojas_final.py

      - name: 💾 Commit & Push Updated Database
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add jobs.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update jobs.db via GitHub Actions [skip ci]" && git push)